<!DOCTYPE html>
<html>
    <head>
        <title>Upcoming Games</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <section class="section">
            <div class="container">
                <div class="columns">
                    <div class="column is-wide">
                        <div class="container">
                            <h1 class="title">Upcoming games</h1>
                            <p class="subtitle">
                                You have <strong id="num_games_wishlisted">0</strong> saved!
                            </p>
                        </div>
                    </div>
                    <div class="column is-narrow">
                        <a class="button is-rounded" href="/home">My Collection</a>
                    </div>
                    <div class="column is-narrow">
                        <button class="button is-text" onclick="logout()">Log out</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Wishlist list -->
        <section class="section" style="padding-top:0">
            <div class="container">
                <h2 class="subtitle"><strong>My Wishlist</strong></h2>
                <div class="wishlist-scroll">
                    <table class="table is-fullwidth is-hoverable">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Platform</th>
                                <th>Release Date</th>
                                <th>IGDB Wantlist</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="wishlistTable"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Calendar -->
        <section class="section" style="padding-top:0">
            <div class="container">
                <h2 class="subtitle"><strong>Release Calendar</strong></h2>

                <!-- Filters -->
                <div class="columns is-vcentered">
                    <div class="column is-narrow">
                        <div class="field has-addons">
                            <div class="control">
                                <span class="button is-static is-small">Platform</span>
                            </div>
                            <div class="control">
                                <div class="select is-small">
                                    <select id="filterPlatform"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="column is-narrow">
                        <div class="field has-addons">
                            <div class="control">
                                <span class="button is-static is-small">Min wantlist</span>
                            </div>
                            <div class="control">
                                <input id="filterWantlist" class="input is-small" type="number" min="0" step="100" value="10" style="width:110px">
                            </div>
                        </div>
                    </div>
                    <div class="column is-narrow">
                        <label class="checkbox" style="font-size:0.9rem">
                            <input type="checkbox" id="filterWishlistOnly">
                            &nbsp;Wishlist only
                        </label>
                    </div>
                    <div class="column has-text-right">
                        <button class="button is-primary is-small" onclick="applyFilters()">Apply</button>
                        <button class="button is-small" onclick="resetFilters()" style="margin-left:4px">Reset</button>
                    </div>
                </div>

                <!-- Month navigation -->
                <div class="columns is-vcentered is-mobile" style="margin-bottom:0.5rem">
                    <div class="column is-narrow">
                        <button class="button is-small" onclick="prevMonth()">&#9664;</button>
                    </div>
                    <div class="column has-text-centered">
                        <strong id="calendarTitle"></strong>
                    </div>
                    <div class="column is-narrow">
                        <button class="button is-small" onclick="nextMonth()">&#9654;</button>
                    </div>
                </div>

                <div class="calendar-grid" id="calendarHeaders"></div>
                <div style="height:4px"></div>
                <div class="calendar-grid" id="calendarGrid"></div>

                <p style="margin-top:0.75rem; font-size:0.78rem; color:#888">
                    ⭐ on your wishlist &nbsp;|&nbsp;
                    <span style="background:#fffbea;border:1px solid #f4d03f;padding:1px 6px;border-radius:3px">yellow</span> = wishlisted &nbsp;|&nbsp;
                    <span style="background:#f0f4ff;border:1px solid #c3cff5;padding:1px 6px;border-radius:3px">blue</span> = not wishlisted
                </p>
            </div>
        </section>

        <script src="/static/wishlist.js"></script>
    
    </body>
</html>
